name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  syntax:
    name: PowerShell syntax + lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Parse the script (fails on any syntax error)
        shell: pwsh
        run: |
          $errors = $null; $tokens = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            "$env:GITHUB_WORKSPACE/src/FFMobileOptimizer.ps1", [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Host "::error file=src/FFMobileOptimizer.ps1,line=$($_.Extent.StartLineNumber)::$($_.Message)" }
            exit 1
          }
          Write-Host "No syntax errors."

      - name: PSScriptAnalyzer (errors only)
        shell: pwsh
        run: |
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module PSScriptAnalyzer -Scope CurrentUser -Force
          $findings = Invoke-ScriptAnalyzer -Path src/FFMobileOptimizer.ps1 -Severity Error
          if ($findings.Count -gt 0) {
            $findings | Format-Table -AutoSize | Out-String | Write-Host
            exit 1
          }
          Write-Host "No analyzer errors."

  tests:
    name: Simulation test suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Make test helpers executable
        run: chmod +x tests/run-tests.sh tests/fake-adb/adb

      - name: Run the suite against the emulated device
        run: bash tests/run-tests.sh
